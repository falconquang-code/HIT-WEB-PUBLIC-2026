<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Thật hay Thách? 🔥</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#FF3E9D;
    --purple:#7B2FF7;
    --indigo:#1B0E3D;
    --yellow:#FFD23F;
    --mint:#2BE0C8;
    --card-truth:#2C1B5E;
    --card-dare:#5E1B3B;
    --ink:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    font-family:'Be Vietnam Pro', sans-serif;
    color:var(--ink);
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,62,157,0.55), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(43,224,200,0.35), transparent 40%),
      radial-gradient(circle at 75% 85%, rgba(123,47,247,0.55), transparent 50%),
      linear-gradient(160deg, #1B0E3D 0%, #2C1257 45%, #3A0F63 100%);
    background-attachment:fixed;
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
  }
  .blob{
    position:fixed;
    border-radius:50%;
    filter:blur(60px);
    opacity:0.45;
    z-index:0;
    pointer-events:none;
    animation:float 14s ease-in-out infinite;
  }
  .blob1{width:280px;height:280px;background:var(--pink);top:-60px;left:-60px;}
  .blob2{width:320px;height:320px;background:var(--mint);bottom:-80px;right:-60px;animation-delay:-4s;}
  .blob3{width:220px;height:220px;background:var(--yellow);top:40%;right:-40px;animation-delay:-8s;opacity:0.25;}
  @keyframes float{
    0%,100%{transform:translateY(0) translateX(0);}
    50%{transform:translateY(-25px) translateX(15px);}
  }
  @media (prefers-reduced-motion: reduce){
    .blob{animation:none;}
  }

  .wrap{
    position:relative;
    z-index:1;
    width:100%;
    max-width:480px;
    padding:28px 20px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
  }

  header{
    text-align:center;
    margin-bottom:22px;
  }
  .logo{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:2.3rem;
    line-height:1.05;
    margin:0;
    letter-spacing:0.5px;
  }
  .logo span.dot{color:var(--yellow);}
  .logo .grad{
    background:linear-gradient(90deg, var(--pink), var(--mint));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .tagline{
    margin:6px 0 0;
    font-size:0.95rem;
    opacity:0.75;
    font-weight:500;
  }

  /* Mode selector */
  .mode-select{
    display:flex;
    gap:10px;
    width:100%;
    margin-bottom:20px;
  }
  .mode-btn{
    flex:1;
    border:2px solid rgba(255,255,255,0.18);
    background:rgba(255,255,255,0.06);
    color:var(--ink);
    padding:13px 8px;
    border-radius:16px;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:1.02rem;
    cursor:pointer;
    transition:transform .15s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease;
    text-align:center;
  }
  .mode-btn:active{transform:scale(0.96);}
  .mode-btn.truth.active{
    background:linear-gradient(135deg, #6C5CE7, #7B2FF7);
    border-color:transparent;
    box-shadow:0 8px 24px rgba(123,47,247,0.45);
  }
  .mode-btn.dare.active{
    background:linear-gradient(135deg, #FF3E9D, #FF7A59);
    border-color:transparent;
    box-shadow:0 8px 24px rgba(255,62,157,0.45);
  }
  .mode-btn.random.active{
    background:linear-gradient(135deg, #2BE0C8, #3AB0FF);
    border-color:transparent;
    box-shadow:0 8px 24px rgba(43,224,200,0.4);
  }

  /* Card area */
  .stage{
    width:100%;
    aspect-ratio:3/4;
    max-height:56vh;
    perspective:1400px;
    margin-bottom:22px;
  }
  .card{
    width:100%;
    height:100%;
    position:relative;
    transform-style:preserve-3d;
    transition:transform .6s cubic-bezier(.2,.9,.25,1.1);
    cursor:pointer;
  }
  .card.flipped{transform:rotateY(180deg);}
  .card.shake{animation:shake .4s ease;}
  @keyframes shake{
    0%,100%{transform:translateX(0) rotateY(var(--ry,0));}
    25%{transform:translateX(-6px);}
    75%{transform:translateX(6px);}
  }
  .face{
    position:absolute;
    inset:0;
    border-radius:26px;
    backface-visibility:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:28px;
    text-align:center;
    box-shadow:0 20px 45px rgba(0,0,0,0.35);
  }
  .face-front{
    background:
      radial-gradient(circle at 30% 20%, rgba(255,255,255,0.12), transparent 60%),
      linear-gradient(150deg, #3A2178, #1B0E3D 70%);
    border:2px solid rgba(255,255,255,0.14);
  }
  .face-front .big-mark{
    font-family:'Baloo 2', sans-serif;
    font-size:5rem;
    font-weight:800;
    background:linear-gradient(90deg, var(--pink), var(--yellow), var(--mint));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin:0;
  }
  .face-front .hint{
    margin-top:10px;
    font-size:0.95rem;
    opacity:0.7;
    font-weight:500;
  }
  .face-back{
    transform:rotateY(180deg);
    justify-content:space-between;
  }
  .face-back.truth-bg{
    background:linear-gradient(155deg, #4A2E9E, #2C1B5E 75%);
    border:2px solid rgba(255,255,255,0.16);
  }
  .face-back.dare-bg{
    background:linear-gradient(155deg, #B0206E, #5E1B3B 75%);
    border:2px solid rgba(255,255,255,0.16);
  }
  .card-kind{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:1.05rem;
    letter-spacing:0.3px;
    padding:6px 18px;
    border-radius:999px;
    background:rgba(255,255,255,0.16);
    margin-top:4px;
  }
  .card-text{
    font-family:'Baloo 2', sans-serif;
    font-weight:600;
    font-size:1.5rem;
    line-height:1.35;
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:6px 4px;
  }
  .card-number{
    font-size:0.8rem;
    opacity:0.6;
    margin-bottom:2px;
    font-weight:500;
  }

  /* Controls */
  .controls{
    display:flex;
    gap:14px;
    width:100%;
  }
  .btn{
    flex:1;
    border:none;
    padding:16px 10px;
    border-radius:18px;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:1.08rem;
    cursor:pointer;
    color:var(--ink);
    transition:transform .15s ease, filter .2s ease;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .btn:active{transform:scale(0.96);}
  .btn-flip{
    background:linear-gradient(135deg, var(--yellow), #FF9A3D);
    color:#2A1200;
    box-shadow:0 10px 26px rgba(255,157,61,0.35);
    flex:1.4;
  }
  .btn-skip{
    background:rgba(255,255,255,0.08);
    border:2px solid rgba(255,255,255,0.22);
  }
  .btn-skip:hover{background:rgba(255,255,255,0.14);}

  .footer-info{
    margin-top:20px;
    font-size:0.82rem;
    opacity:0.55;
    text-align:center;
  }

  .badge-count{
    position:absolute;
    top:14px;
    right:16px;
    font-size:0.75rem;
    background:rgba(0,0,0,0.28);
    padding:5px 10px;
    border-radius:999px;
    font-weight:600;
    opacity:0.85;
  }

  @media (max-width:360px){
    .logo{font-size:1.9rem;}
    .card-text{font-size:1.28rem;}
    .face-front .big-mark{font-size:4rem;}
  }
</style>
</head>
<body>
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>

  <div class="wrap">
    <header>
      <h1 class="logo">Thật <span class="dot">hay</span> <span class="grad">Thách?</span> 🔥</h1>
      <p class="tagline">Chọn phe, lật thẻ, dám không dám!</p>
    </header>

    <div class="mode-select" role="group" aria-label="Chọn chế độ">
      <button class="mode-btn truth active" data-mode="truth">😳 Thật</button>
      <button class="mode-btn dare" data-mode="dare">🔥 Thách</button>
      <button class="mode-btn random" data-mode="random">🎲 Ngẫu nhiên</button>
    </div>

    <div class="stage">
      <div class="card" id="card">
        <div class="face face-front" id="faceFront">
          <span class="badge-count" id="playedCount">Đã chơi: 0</span>
          <p class="big-mark" id="frontMark">?</p>
          <p class="hint">Chạm vào thẻ hoặc bấm "Lật thẻ"</p>
        </div>
        <div class="face face-back" id="faceBack">
          <div class="card-number" id="cardNumber">#1</div>
          <span class="card-kind" id="cardKind">THẬT</span>
          <div class="card-text" id="cardText">Câu hỏi sẽ hiện ở đây...</div>
          <div style="height:4px;"></div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-skip" id="skipBtn">⏭️ Bỏ qua</button>
      <button class="btn btn-flip" id="flipBtn">🎴 Lật thẻ</button>
    </div>

    <p class="footer-info">Chơi cùng bạn bè, tôn trọng giới hạn của nhau nhé 💜</p>
  </div>

let mode = 'truth'; // truth | dare | random
let currentType = 'truth';
let flipped = false;
let playedCount = 0;
let usedTruth = [];
let usedDare = [];

const card = document.getElementById('card');
const faceBack = document.getElementById('faceBack');
const cardKind = document.getElementById('cardKind');
const cardText = document.getElementById('cardText');
const cardNumber = document.getElementById('cardNumber');
const frontMark = document.getElementById('frontMark');
const flipBtn = document.getElementById('flipBtn');
const skipBtn = document.getElementById('skipBtn');
const playedCountEl = document.getElementById('playedCount');
const modeBtns = document.querySelectorAll('.mode-btn');

function pickRandom(list, used){
  if(used.length >= list.length){ used.length = 0; }
  let idx;
  do{ idx = Math.floor(Math.random()*list.length); } while(used.includes(idx));
  used.push(idx);
  return {text:list[idx], idx};
}

function setMode(m){
  mode = m;
  modeBtns.forEach(b=>b.classList.toggle('active', b.dataset.mode===m));
  frontMark.textContent = m==='truth' ? '😳' : m==='dare' ? '🔥' : '🎲';
}

function drawCard(){
  let type = mode;
  if(mode==='random'){ type = Math.random() < 0.5 ? 'truth' : 'dare'; }
  currentType = type;
  let result;
  if(type==='truth'){
    result = pickRandom(TRUTHS, usedTruth);
    cardKind.textContent = 'THẬT 😳';
    faceBack.classList.remove('dare-bg');
    faceBack.classList.add('truth-bg');
  } else {
    result = pickRandom(DARES, usedDare);
    cardKind.textContent = 'THÁCH 🔥';
    faceBack.classList.remove('truth-bg');
    faceBack.classList.add('dare-bg');
  }
  cardText.textContent = result.text;
  cardNumber.textContent = '#' + (result.idx+1);
}

function flipCard(forceNew){
  if(!flipped){
    drawCard();
    card.classList.add('flipped');
    flipped = true;
    playedCount++;
    playedCountEl.textContent = 'Đã chơi: ' + playedCount;
  } else if(forceNew){
    // flip back then reveal a new one
    card.classList.remove('flipped');
    setTimeout(()=>{
      drawCard();
      card.classList.add('flipped');
      playedCount++;
      playedCountEl.textContent = 'Đã chơi: ' + playedCount;
    }, 300);
  } else {
    card.classList.remove('flipped');
    flipped = false;
  }
}

flipBtn.addEventListener('click', ()=>{
  if(!flipped){
    flipCard(false);
    flipBtn.textContent = '🔄 Thẻ mới';
  } else {
    flipCard(true);
  }
});

card.addEventListener('click', ()=>{
  if(!flipped){
    flipCard(false);
    flipBtn.textContent = '🔄 Thẻ mới';
  }
});

skipBtn.addEventListener('click', ()=>{
  card.classList.add('shake');
  setTimeout(()=>card.classList.remove('shake'), 400);
  if(flipped){
    card.classList.remove('flipped');
    setTimeout(()=>{
      drawCard();
      card.classList.add('flipped');
    }, 300);
  } else {
    drawCard();
  }
});

modeBtns.forEach(btn=>{
  btn.addEventListener('click', ()=>{
    setMode(btn.dataset.mode);
    if(flipped){
      card.classList.remove('flipped');
      flipped = false;
      flipBtn.textContent = '🎴 Lật thẻ';
    }
  });
});

setMode('truth');
</script>
</body>
</html>
